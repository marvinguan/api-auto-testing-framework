name: API Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 启动 Restful-Booker 靶场 (Docker)
      run: docker run -d -p 3001:3001 mwinteringham/restful-booker

    - name: 等待环境就绪
      run: sleep 5

    - name: 执行自动化测试 (生成 Allure 报告)
      env:
        BASE_URL: http://localhost:3001
      run: pytest

    - name: 上传 Allure 测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: report/