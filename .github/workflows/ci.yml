name: API Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 👇 替换了原来的 Docker 步骤，直接用源码启动，避开镜像被删的坑
    - name: 克隆并启动 Restful-Booker 靶场
      run: |
        git clone https://github.com/mwinteringham/restful-booker.git
        cd restful-booker
        npm install
        npm start &
        sleep 15

    - name: 执行自动化测试
      env:
        BASE_URL: http://localhost:3001
      run: pytest

    - name: 上传 Allure 测试报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: report/